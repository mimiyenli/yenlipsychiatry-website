    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

<body class="subpage contact">
    <nav class="topnav">
        <a class="brand" href="index.html">Yen Li Psychiatry</a>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="bio.html">Bio</a>
            <a href="services.html">Services</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html" class="cta active">Reach out</a>
        </div>
    </nav>

    <main class="page-body">
        <header class="page-header">
            <div class="eyebrow">Reach out</div>
            <h1>Let's start with a <em>conversation</em>.</h1>
            <p class="summary">A free 15-minute call to see if we're a fit. No commitment.</p>
        </header>

        <section class="page-content">
            <div class="cards">
                <a class="card sage" href="mailto:[email]">
                    <div class="icon">@</div>
                    <h3>Email</h3>
                    <p>[your email]</p>
                </a>
                <a class="card clay" href="tel:[phone]">
                    <div class="icon">☎</div>
                    <h3>Call</h3>
                    <p>[your phone]</p>
                </a>
                <a class="card moss" href="#">
                    <div class="icon">→</div>
                    <h3>Book online</h3>
                    <p>Pick a time that works — confirmation in your inbox.</p>
                </a>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
